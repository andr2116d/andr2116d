<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="663" viewBox="0 0 1200 663" role="img" aria-label="Sobre mí: Desarrollador backend y frontend autodidacta, de Trujillo, Perú. Estudio Ingeniería Química en la UNT e Ingeniería de Sistemas e IA en la UPAO: de la primera traigo el pensamiento en procesos; de la segunda, las herramientas para automatizarlos.">
<style>
  /* el estado oculto vive solo dentro de la animación ("both"): si un visor no
     ejecuta animaciones, el contenido se ve igual */
  .fade { animation: fadein .9s ease-out both; }
  .lift { animation: lift 3s ease-in-out infinite; }
  .pop { transform-box:fill-box; transform-origin:center; animation: pop 2.4s ease-in-out infinite; }
  .draw { stroke-dasharray:60; animation: draw 2.2s ease-out .8s both; }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }
  @keyframes lift { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-3px) } }
  @keyframes pop { 0%,100% { transform:scale(.6) } 50% { transform:scale(1.15) } }
  @keyframes draw { from { stroke-dashoffset:60; } to { stroke-dashoffset:0; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05080f"/><stop offset="1" stop-color="#080c14"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#141d2b"/>
  </pattern>
</defs>
<rect width="1200" height="663" rx="18" fill="url(#bg)"/>
<rect width="1200" height="663" rx="18" fill="url(#dots)" opacity=".5"/>
<text class="fade" x="60" y="60" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#22d3ee">// perfil</text>
<text class="fade" x="60" y="100" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#e6edf3">Sobre mí</text>
<rect class="fade" x="60" y="114" width="64" height="4" rx="2" fill="url(#line)"/>
<text class="fade" style="animation-delay:.2s" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#e6edf3">
<tspan x="60" y="160">Desarrollador backend y frontend autodidacta, de Trujillo, Perú. Estudio</tspan>
<tspan x="60" y="194">Ingeniería Química en la UNT e Ingeniería de Sistemas e IA en la UPAO: de la</tspan>
<tspan x="60" y="228">primera traigo el pensamiento en procesos; de la segunda, las herramientas para</tspan>
<tspan x="60" y="262">automatizarlos.</tspan>
</text>
<g class="fade" style="animation-delay:0.50s">
<rect x="60" y="314" width="340" height="215" rx="14" fill="#080c14" stroke="#13303c" stroke-width="1.2"/>
<rect x="60" y="314" width="4" height="215" rx="2" fill="url(#line)"/>
<g transform="translate(82,332) scale(1.2) translate(-82,-332)"><g transform="translate(82,332)" fill="none" stroke-width="2.2" stroke-linejoin="round"><path d="M20 4 L36 12 L20 20 L4 12 Z" stroke="#22d3ee"/><path class="lift" d="M4 20 L20 28 L36 20" stroke="#a78bfa"/><path d="M4 28 L20 36 L36 28" stroke="#22d3ee" opacity=".6"/></g></g>
<text x="144" y="363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#e6edf3">Construyo</text>
<text font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.5" fill="#e6edf3" fill-opacity=".75">
<tspan x="82" y="410">APIs, backends y aplicaciones</tspan>
<tspan x="82" y="438">web completas, desde la base de</tspan>
<tspan x="82" y="466">datos hasta la interfaz,</tspan>
<tspan x="82" y="494">pensadas para usarse de verdad.</tspan>
</text></g>
<g class="fade" style="animation-delay:0.75s">
<rect x="430" y="314" width="340" height="215" rx="14" fill="#080c14" stroke="#13303c" stroke-width="1.2"/>
<rect x="430" y="314" width="4" height="215" rx="2" fill="url(#line)"/>
<g transform="translate(452,332) scale(1.2) translate(-452,-332)"><g transform="translate(452,332)" stroke-width="2"><path d="M8 30 L20 10 L32 26 L8 30 M20 10 L20 24" stroke="#22d3ee" fill="none"/><circle cx="20" cy="10" r="4.5" fill="#080c14" stroke="#a78bfa"/><circle cx="8" cy="30" r="4.5" fill="#080c14" stroke="#22d3ee"/><circle cx="32" cy="26" r="4.5" fill="#080c14" stroke="#22d3ee"/><circle class="pop" cx="20" cy="24" r="3.5" fill="#a78bfa"/></g></g>
<text x="514" y="363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#e6edf3">Aprendo</text>
<text font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.5" fill="#e6edf3" fill-opacity=".75">
<tspan x="452" y="410">Tecnologías nuevas de forma</tspan>
<tspan x="452" y="438">constante. Hoy mi foco es la</tspan>
<tspan x="452" y="466">IA: aprendizaje por refuerzo y</tspan>
<tspan x="452" y="494">redes neuronales de grafos.</tspan>
</text></g>
<g class="fade" style="animation-delay:1.00s">
<rect x="800" y="314" width="340" height="215" rx="14" fill="#080c14" stroke="#13303c" stroke-width="1.2"/>
<rect x="800" y="314" width="4" height="215" rx="2" fill="url(#line)"/>
<g transform="translate(822,332) scale(1.2) translate(-822,-332)"><g transform="translate(822,332)" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 36 L36 36 M4 36 L4 4" stroke="#7d8794" opacity=".6"/><path class="draw" d="M6 32 L14 26 L21 28 L30 14 L36 8" stroke="#a78bfa"/><path d="M30 8 L36 8 L36 14" stroke="#a78bfa"/></g></g>
<text x="884" y="363" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#e6edf3">Mejoro</text>
<text font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.5" fill="#e6edf3" fill-opacity=".75">
<tspan x="822" y="410">Buenas prácticas, código</tspan>
<tspan x="822" y="438">limpio, pruebas y arquitectura.</tspan>
<tspan x="822" y="466">Cada proyecto suma experiencia</tspan>
<tspan x="822" y="494">y sale mejor que el anterior.</tspan>
</text></g>
<g class="fade" style="animation-delay:1.2s"><rect x="60" y="553" width="1080" height="58" rx="14" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".35"/><g transform="translate(80,563)" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2 H24 M14 2 V14 L4 34 a2 2 0 0 0 2 3 H30 a2 2 0 0 0 2 -3 L22 14 V2"/><path d="M8 27 H28" stroke-opacity=".6"/></g><circle cx="93" cy="595" r="2" fill="#a78bfa"><animate attributeName="cy" values="595;567" dur="2.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle><circle cx="101" cy="595" r="1.6" fill="#a78bfa"><animate attributeName="cy" values="595;567" dur="1.8s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.7s" repeatCount="indefinite"/></circle><circle cx="97" cy="595" r="1.3" fill="#a78bfa"><animate attributeName="cy" values="595;567" dur="2.6s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle><text x="132" y="589" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e6edf3" fill-opacity=".85"><tspan font-weight="700" fill="#a78bfa" fill-opacity="1">Dato curioso:</tspan> paso de balances de materia a balanceadores de carga sin cambiar de cuaderno.</text></g>
<text class="fade" style="animation-delay:1.4s" x="600.0" y="647" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#7d8794">Abierto a colaborar en backend, frontend, IA y software para la industria química</text>
</svg>