<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Quikko: URL shortener with a Go API, real-time metrics over WebSockets, GeoIP and a Next.js dashboard.">
<style>
  /* todo el contenido es visible desde el inicio: las animaciones solo decoran */
  .live { animation: live 1.8s ease-in-out infinite; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  .shine { animation: shine 3.5s ease-in-out infinite; }
  @keyframes live { 50% { opacity:.3 } }
  @keyframes twinkle { 50% { opacity:.35 } }
  @keyframes shine { 0% { transform:translateX(-120px) } 60%,100% { transform:translateX(600px) } }
</style>
