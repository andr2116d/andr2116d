  <linearGradient id="gloss" x1="0" x2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="bar"><rect x="28" y="334" width="544" height="8" rx="4"/></clipPath>
</defs>
<rect x="1" y="1" width="598" height="398" rx="16" fill="url(#bg)"/>
