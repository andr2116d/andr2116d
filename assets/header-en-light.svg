<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Andreé Vargas">
<style>
  .bond { stroke:#0e7490; stroke-width:2.5; }
  .edge { stroke:#a9c9d6; stroke-width:1.2; }
  .flow { stroke:#0e7490; stroke-width:1.4; stroke-dasharray:4 14;
           opacity:.55; animation: flow 2.4s linear infinite; }
  .atom { fill:#edf2f6; stroke:#0e7490; stroke-width:2.5; }
  .neuron { fill:#edf2f6; stroke:#6d28d9; stroke-width:2; }
  .core { fill:#0e7490; transform-box:fill-box; transform-origin:center;
           animation: beat 2.8s ease-in-out infinite; }
  .core2 { fill:#6d28d9; transform-box:fill-box; transform-origin:center;
            animation: beat 2.8s ease-in-out infinite; }
  .ring { animation: spin 12s linear infinite; transform-origin:735px 150px; }
  .fade { opacity:0; animation: fadein 1s ease-out forwards; }
  .cursor { animation: blink 1s step-end infinite; }
  @keyframes flow { to { stroke-dashoffset:-36; } }
  @keyframes beat { 0%,100% { transform:scale(.55); opacity:.55 } 50% { transform:scale(1); opacity:1 } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes fadein { to { opacity:1; } }
  @keyframes blink { 50% { opacity:0; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
