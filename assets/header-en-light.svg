  </linearGradient>
  <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
    <stop offset="0" stop-color="#0e7490" stop-opacity=".16"/>
    <stop offset="1" stop-color="#0e7490" stop-opacity="0"/>
  </radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#c6d3de"/>
  </pattern>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <clipPath id="type"><rect x="70" y="170" height="40" width="0">
