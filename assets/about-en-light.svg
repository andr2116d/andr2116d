<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="629" viewBox="0 0 1200 629" role="img" aria-label="About me: Self-taught backend and frontend developer from Trujillo, Peru. I study Chemical Engineering at UNT and Systems Engineering &amp; AI at UPAO: from the first I bring process thinking; from the second, the tools to automate it.">
<style>
  /* el estado oculto vive solo dentro de la animación ("both"): si un visor no
     ejecuta animaciones, el contenido se ve igual */
  .fade { animation: fadein .9s ease-out both; }
  .lift { animation: lift 3s ease-in-out infinite; }
  .pop { transform-box:fill-box; transform-origin:center; animation: pop 2.4s ease-in-out infinite; }
  .draw { stroke-dasharray:60; animation: draw 2.2s ease-out .8s both; }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }
  @keyframes lift { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-3px) } }
  @keyframes pop { 0%,100% { transform:scale(.6) } 50% { transform:scale(1.15) } }
  @keyframes draw { from { stroke-dashoffset:60; } to { stroke-dashoffset:0; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#dfe9f1"/><stop offset="1" stop-color="#edf2f6"/>
  </linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#0e7490"/><stop offset="1" stop-color="#6d28d9"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#c6d3de"/>
  </pattern>
</defs>
<rect width="1200" height="629" rx="18" fill="url(#bg)"/>
<rect width="1200" height="629" rx="18" fill="url(#dots)" opacity=".5"/>
<text class="fade" x="60" y="60" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#0e7490">// profile</text>
<text class="fade" x="60" y="100" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#0b1220">About me</text>
<rect class="fade" x="60" y="114" width="64" height="4" rx="2" fill="url(#line)"/>
<text class="fade" style="animation-delay:.2s" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="23" fill="#0b1220">
<tspan x="60" y="160">Self-taught backend and frontend developer from Trujillo, Peru. I study Chemical</tspan>
<tspan x="60" y="194">Engineering at UNT and Systems Engineering &amp; AI at UPAO: from the first I bring</tspan>
<tspan x="60" y="228">process thinking; from the second, the tools to automate it.</tspan>
</text>
<g class="fade" style="animation-delay:0.50s">
<rect x="60" y="280" width="340" height="215" rx="14" fill="#edf2f6" stroke="#a9c9d6" stroke-width="1.2"/>
<rect x="60" y="280" width="4" height="215" rx="2" fill="url(#line)"/>
<g transform="translate(82,298) scale(1.2) translate(-82,-298)"><g transform="translate(82,298)" fill="none" stroke-width="2.2" stroke-linejoin="round"><path d="M20 4 L36 12 L20 20 L4 12 Z" stroke="#0e7490"/><path class="lift" d="M4 20 L20 28 L36 20" stroke="#6d28d9"/><path d="M4 28 L20 36 L36 28" stroke="#0e7490" opacity=".6"/></g></g>
<text x="144" y="329" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0b1220">I build</text>
<text font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.5" fill="#0b1220" fill-opacity=".75">
<tspan x="82" y="376">APIs, backends and full web</tspan>
<tspan x="82" y="404">applications, from the database</tspan>
<tspan x="82" y="432">to the interface, designed to</tspan>
<tspan x="82" y="460">be actually used.</tspan>
</text></g>
<g class="fade" style="animation-delay:0.75s">
<rect x="430" y="280" width="340" height="215" rx="14" fill="#edf2f6" stroke="#a9c9d6" stroke-width="1.2"/>
<rect x="430" y="280" width="4" height="215" rx="2" fill="url(#line)"/>
<g transform="translate(452,298) scale(1.2) translate(-452,-298)"><g transform="translate(452,298)" stroke-width="2"><path d="M8 30 L20 10 L32 26 L8 30 M20 10 L20 24" stroke="#0e7490" fill="none"/><circle cx="20" cy="10" r="4.5" fill="#edf2f6" stroke="#6d28d9"/><circle cx="8" cy="30" r="4.5" fill="#edf2f6" stroke="#0e7490"/><circle cx="32" cy="26" r="4.5" fill="#edf2f6" stroke="#0e7490"/><circle class="pop" cx="20" cy="24" r="3.5" fill="#6d28d9"/></g></g>
<text x="514" y="329" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0b1220">I learn</text>
<text font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.5" fill="#0b1220" fill-opacity=".75">
<tspan x="452" y="376">New technologies all the time.</tspan>
<tspan x="452" y="404">Right now my focus is AI:</tspan>
<tspan x="452" y="432">reinforcement learning and</tspan>
<tspan x="452" y="460">graph neural networks.</tspan>
</text></g>
<g class="fade" style="animation-delay:1.00s">
<rect x="800" y="280" width="340" height="215" rx="14" fill="#edf2f6" stroke="#a9c9d6" stroke-width="1.2"/>
<rect x="800" y="280" width="4" height="215" rx="2" fill="url(#line)"/>
<g transform="translate(822,298) scale(1.2) translate(-822,-298)"><g transform="translate(822,298)" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 36 L36 36 M4 36 L4 4" stroke="#4b5563" opacity=".6"/><path class="draw" d="M6 32 L14 26 L21 28 L30 14 L36 8" stroke="#6d28d9"/><path d="M30 8 L36 8 L36 14" stroke="#6d28d9"/></g></g>
<text x="884" y="329" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#0b1220">I improve</text>
<text font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19.5" fill="#0b1220" fill-opacity=".75">
<tspan x="822" y="376">Good practices, clean code,</tspan>
<tspan x="822" y="404">testing and architecture. Every</tspan>
<tspan x="822" y="432">project adds experience and</tspan>
<tspan x="822" y="460">turns out better than the last.</tspan>
</text></g>
<g class="fade" style="animation-delay:1.2s"><rect x="60" y="519" width="1080" height="58" rx="14" fill="#6d28d9" fill-opacity=".08" stroke="#6d28d9" stroke-opacity=".35"/><g transform="translate(80,529)" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2 H24 M14 2 V14 L4 34 a2 2 0 0 0 2 3 H30 a2 2 0 0 0 2 -3 L22 14 V2"/><path d="M8 27 H28" stroke-opacity=".6"/></g><circle cx="93" cy="561" r="2" fill="#6d28d9"><animate attributeName="cy" values="561;533" dur="2.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle><circle cx="101" cy="561" r="1.6" fill="#6d28d9"><animate attributeName="cy" values="561;533" dur="1.8s" begin="0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.7s" repeatCount="indefinite"/></circle><circle cx="97" cy="561" r="1.3" fill="#6d28d9"><animate attributeName="cy" values="561;533" dur="2.6s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></circle><text x="132" y="555" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#0b1220" fill-opacity=".85"><tspan font-weight="700" fill="#6d28d9" fill-opacity="1">Fun fact:</tspan> I switch from mass balances to load balancers without changing notebooks.</text></g>
<text class="fade" style="animation-delay:1.4s" x="600.0" y="613" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#4b5563">Open to collaborating on backend, frontend, AI and software for the chemical industry</text>
</svg>