<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Thanks for stopping by">
<style>
  .edge { stroke:#13303c; stroke-width:1.2; }
  .flow { stroke:#22d3ee; stroke-width:1.3; stroke-dasharray:4 14; opacity:.5; animation: flow 2.4s linear infinite; }
  .beat { transform-box:fill-box; transform-origin:center; animation: beat 2.8s ease-in-out infinite; }
  .ring { transform-origin:1060px 115px; animation: spin 12s linear infinite reverse; }
  @keyframes flow { to { stroke-dashoffset:-36; } }
  @keyframes beat { 0%,100% { transform:scale(.55); opacity:.55 } 50% { transform:scale(1); opacity:1 } }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05080f"/><stop offset="1" stop-color="#080c14"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".14"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#141d2b"/></pattern>
</defs>
